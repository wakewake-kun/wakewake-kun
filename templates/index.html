<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#065f46">
  <title>分け分けくん｜名古屋市ごみ分別サポート</title>
  <!-- スマホのホーム画面追加用アイコン -->
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23065f46'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white'>♻️</text></svg>">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23065f46'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white'>♻️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #065f46;
      --primary-light: #059669;
      --primary-soft: #ecfdf5;
      --accent: #ea580c;
      --accent-hover: #c2410c;
      --nagoya: #b45309;
      --nagoya-soft: #fffbeb;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 16px 36px -8px rgba(15, 23, 42, 0.1);
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #e2e8f0 0%, #f8fafc 28%, #f1f5f9 100%);
      color: var(--text-main);
      margin: 0;
      padding: 0 16px 40px;
      min-height: 100vh;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* モダン・アプリヘッダー */
    header {
      background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
      color: #ffffff;
      margin: 0 -16px 20px;
      padding: 24px 20px 32px;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: 0 10px 25px -5px rgba(6, 78, 59, 0.28);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 50%;
      pointer-events: none;
    }

    .header-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.9;
      font-weight: 500;
    }

    /* メインカード */
    .card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-top: -14px;
      position: relative;
      z-index: 2;
    }

    /* コントロールパネル（声・方言切り替え） */
    .controls-panel {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin-bottom: 18px;
      display: grid;
      gap: 10px;
    }

    .control-group {
      text-align: left;
    }

    .control-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 5px;
      padding-left: 2px;
      letter-spacing: 0.05em;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: var(--radius-md);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 8px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .seg-btn:hover:not(.active) {
      color: var(--text-main);
    }

    .voice-opt.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.1);
    }

    .dialect-opt.active {
      background: var(--surface);
      color: var(--nagoya);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.1);
    }

    /* カメラアクションボタン */
    .camera-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      padding: 20px 16px;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 10px 22px -6px rgba(234, 88, 12, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-bottom: 16px;
      user-select: none;
    }

    .camera-btn:hover {
      box-shadow: 0 14px 26px -6px rgba(234, 88, 12, 0.55);
    }

    .camera-btn:active {
      transform: scale(0.98);
      box-shadow: 0 6px 14px -4px rgba(234, 88, 12, 0.4);
    }

    .camera-btn-main {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .camera-btn-sub {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.92;
      margin-top: 4px;
    }

    input[type="file"] {
      display: none;
    }

    /* 撮影のコツ */
    .photo-tips {
      background: var(--primary-soft);
      border: 1px solid #a7f3d0;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      line-height: 1.55;
      color: #064e3b;
    }

    .photo-tips-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--primary);
    }

    .photo-tips ul {
      margin: 0;
      padding-left: 18px;
    }

    .photo-tips li {
      margin-bottom: 3px;
    }

    .photo-tips li:last-child {
      margin-bottom: 0;
    }

    /* 画像プレビュー */
    #preview-wrapper {
      display: none;
      margin-top: 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 8px;
      animation: fadeIn 0.25s ease;
    }

    #preview {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
    }

    /* ローディングアニメーション */
    #loading {
      display: none;
      padding: 28px 16px;
      text-align: center;
      animation: fadeIn 0.2s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #d1fae5;
      border-top-color: var(--primary-light);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 0.85s linear infinite;
    }

    .loading-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .loading-sub {
      font-size: 13px;
      color: var(--text-sub);
    }

    /* 判定結果エリア */
    #result-area {
      display: none;
      text-align: left;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px dashed var(--border);
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .result-eyebrow {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .item-name {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.3;
      margin: 0 0 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--primary-soft);
      color: var(--primary);
      font-size: 19px;
      font-weight: 900;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      border: 2px solid var(--primary-light);
      margin-bottom: 14px;
      width: 100%;
    }

    /* 分別区分ごとのカラーバリエーション */
    .badge.cat-plastic {
      background-color: #eff6ff;
      color: #1d4ed8;
      border-color: #3b82f6;
    }

    .badge.cat-burnable {
      background-color: #fef2f2;
      color: #b91c1c;
      border-color: #ef4444;
    }

    .badge.cat-nonburnable {
      background-color: #f5f3ff;
      color: #5b21b6;
      border-color: #8b5cf6;
    }

    .badge.cat-resource {
      background-color: #ecfdf5;
      color: #065f46;
      border-color: #10b981;
    }

    .badge.cat-hazardous {
      background-color: #fffbeb;
      color: #b45309;
      border-color: #f59e0b;
    }

    .guide-text {
      font-size: 18px;
      line-height: 1.75;
      color: #1e293b;
      background: #f8fafc;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .points-list {
      background-color: var(--nagoya-soft);
      border: 1px solid #fde68a;
      border-left: 4px solid #f59e0b;
      border-radius: var(--radius-md);
      padding: 12px 16px 12px 32px;
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.6;
      color: #78350f;
      display: none;
    }

    .points-list li {
      margin-bottom: 6px;
    }

    .points-list li:last-child {
      margin-bottom: 0;
    }

    /* 音声再生ボタン */
    .speak-btn {
      width: 100%;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 18px -5px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s ease, opacity 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .speak-btn:active {
      transform: scale(0.98);
    }

    .speak-btn:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: wait;
    }

    .source-link {
      text-align: center;
      font-size: 13px;
      color: var(--text-sub);
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .source-link a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .source-link a:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="app-container">
    <header>
      <div class="header-pill">♻️ AI ごみ分別サポート</div>
      <h1>分け分けくん</h1>
      <p>名古屋市の分別ルールを写真と音声でご案内</p>
    </header>

    <main class="card">
      <!-- 声と方言のコントロール -->
      <div class="controls-panel">
        <div class="control-group">
          <span class="control-label">声のタイプ</span>
          <div class="segmented">
            <button type="button" id="btn-female" class="seg-btn voice-opt active" onclick="setGender('female')">👩 女性の声</button>
            <button type="button" id="btn-male" class="seg-btn voice-opt" onclick="setGender('male')">👨 男性の声</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">案内スタイル</span>
          <div class="segmented">
            <button type="button" id="btn-standard" class="seg-btn dialect-opt active" onclick="setDialect('standard')">🗾 標準語</button>
            <button type="button" id="btn-nagoya" class="seg-btn dialect-opt" onclick="setDialect('nagoya')">🏯 名古屋弁</button>
          </div>
        </div>
      </div>

      <!-- カメラ起動CTA -->
      <label for="cameraInput" class="camera-btn">
        <span class="camera-btn-main">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          カメラでうつす
        </span>
        <span class="camera-btn-sub">タップして撮影、または写真フォルダから選択</span>
      </label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">

      <!-- 撮影のコツ -->
      <div class="photo-tips">
        <div class="photo-tips-title">きれいに判定するコツ</div>
        <ul>
          <li><b>卵パックなどの透明ごみ</b>は、黒っぽい場所を避けて明るい机の上で撮ると見分けやすくなります。</li>
          <li>容器の<b>「プラ」「紙」マーク</b>が写るように撮るとさらに正確です。</li>
        </ul>
      </div>

      <!-- 画像プレビュー -->
      <div id="preview-wrapper">
        <img id="preview" alt="撮影した写真">
      </div>

      <!-- ローディング -->
      <div id="loading">
        <div class="spinner"></div>
        <div class="loading-title">分別方法を調べています...</div>
        <div class="loading-sub">画像解析と音声を作成中です</div>
      </div>

      <!-- 判定結果 -->
      <div id="result-area">
        <div class="result-eyebrow">判定された品目</div>
        <div class="item-name" id="item-name"></div>
        <div class="badge" id="category-badge"></div>
        <div class="guide-text" id="guide-text"></div>
        <ul class="points-list" id="points-list"></ul>

        <button type="button" class="speak-btn" onclick="speakResult()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          もう一度 声で聞く
        </button>

        <div class="source-link">
          出典：<a id="source-url" href="https://www.city.nagoya.jp/kurashi/category/5-4-0-0-0-0-0-0-0-0.html" target="_blank" rel="noopener">名古屋市公式ウェブサイト ↗</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "https://go6oluzfsij6oqtztenyvl5vtm0afuvf.lambda-url.ap-northeast-1.on.aws/";

    let selectedGender = "female";
    let selectedDialect = "standard";
    let currentResultData = null;
    let audioCache = {
      standard_female: "",
      standard_male: "",
      nagoya_female: "",
      nagoya_male: ""
    };
    let currentAudio = null;

    let femaleVoice = null;
    let maleVoice = null;

    function loadJapaneseVoices() {
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      const jpVoices = voices.filter(v => v.lang === "ja-JP" || v.lang === "ja_JP" || v.lang.includes("ja"));
      if (!jpVoices.length) return;

      femaleVoice =
        jpVoices.find(v => /Nanami|Google 日本語|Kyoko|O-Ren|Haruka|Ayumi/i.test(v.name)) ||
        jpVoices[0];

      maleVoice =
        jpVoices.find(v => /Keita|Otoya|Hattori|Ichiro/i.test(v.name)) ||
        jpVoices.find(v => v !== femaleVoice) ||
        femaleVoice;
    }

    if ("speechSynthesis" in window) {
      loadJapaneseVoices();
      window.speechSynthesis.onvoiceschanged = loadJapaneseVoices;
    }

    function getActiveSpeechText() {
      if (!currentResultData) return "";
      return selectedDialect === "nagoya"
        ? currentResultData.speechNagoya
        : currentResultData.speechStandard;
    }

    function applyCategoryStyle(categoryLabel) {
      const badgeEl = document.getElementById("category-badge");
      badgeEl.className = "badge";
      let icon = "♻️";

      if (/プラスチック/.test(categoryLabel)) {
        badgeEl.classList.add("cat-plastic");
        icon = "🧴";
      } else if (/可燃/.test(categoryLabel)) {
        badgeEl.classList.add("cat-burnable");
        icon = "🔥";
      } else if (/不燃/.test(categoryLabel)) {
        badgeEl.classList.add("cat-nonburnable");
        icon = "🛠️";
      } else if (/資源|紙製/.test(categoryLabel)) {
        badgeEl.classList.add("cat-resource");
        icon = "📦";
      } else if (/有害|電池|粗大/.test(categoryLabel)) {
        badgeEl.classList.add("cat-hazardous");
        icon = "⚠️";
      }

      badgeEl.textContent = `${icon} ${categoryLabel}`;
    }

    function updateDisplayedResult() {
      if (!currentResultData) return;
      const isNagoya = selectedDialect === "nagoya";
      document.getElementById("guide-text").textContent = isNagoya
        ? currentResultData.guideNagoya
        : currentResultData.guideStandard;
      renderPoints(isNagoya ? currentResultData.pointsNagoya : currentResultData.pointsStandard);
    }

    async function setGender(gender) {
      selectedGender = gender;
      document.getElementById("btn-female").classList.toggle("active", gender === "female");
      document.getElementById("btn-male").classList.toggle("active", gender === "male");

      if (!currentResultData) return;
      const cacheKey = `${selectedDialect}_${selectedGender}`;
      if (audioCache[cacheKey]) {
        speakResult();
      } else {
        await fetchPollyVoiceForCurrentText();
      }
    }

    async function setDialect(dialect) {
      selectedDialect = dialect;
      document.getElementById("btn-standard").classList.toggle("active", dialect === "standard");
      document.getElementById("btn-nagoya").classList.toggle("active", dialect === "nagoya");

      if (!currentResultData) return;
      updateDisplayedResult();

      const cacheKey = `${selectedDialect}_${selectedGender}`;
      if (audioCache[cacheKey]) {
        speakResult();
      } else {
        await fetchPollyVoiceForCurrentText();
      }
    }

    document.getElementById("cameraInput").addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const preview = document.getElementById("preview");
      const previewWrapper = document.getElementById("preview-wrapper");
      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        previewWrapper.style.display = "block";
        resizeAndSendImage(e.target.result);
      };
      reader.readAsDataURL(file);
    });

    function resizeAndSendImage(dataUrl) {
      document.getElementById("loading").style.display = "block";
      document.getElementById("result-area").style.display = "none";
      stopCurrentAudio();

      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement("canvas");
        const MAX_WIDTH = 800;
        let width = img.width;
        let height = img.height;

        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const resizedBase64 = canvas.toDataURL("image/jpeg", 0.8);
        audioCache = {
          standard_female: "",
          standard_male: "",
          nagoya_female: "",
          nagoya_male: ""
        };
        sendToAws(resizedBase64);
      };
      img.src = dataUrl;
    }

    function renderPoints(points) {
      const listEl = document.getElementById("points-list");
      listEl.innerHTML = "";
      if (Array.isArray(points) && points.length > 0) {
        points.forEach(pt => {
          const li = document.createElement("li");
          li.textContent = pt;
          listEl.appendChild(li);
        });
        listEl.style.display = "block";
      } else {
        listEl.style.display = "none";
      }
    }

    async function sendToAws(base64Image) {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image: base64Image,
            voice: selectedGender,
            dialect: selectedDialect
          })
        });

        const data = await response.json();
        document.getElementById("loading").style.display = "none";

        const res = data.result || data;
        const itemLabel = res.item_jp || res.item;

        if (itemLabel) {
          const categoryLabel = res.category || "分別案内";
          const guideStd = res.guide || res.instruction || res.advice || res.reason || "";
          const pointsStd = res.points || data.points || [];
          const guideNgy = res.guide_nagoya || guideStd;
          const pointsNgy = res.points_nagoya || pointsStd;

          currentResultData = {
            item: itemLabel,
            category: categoryLabel,
            guideStandard: guideStd,
            pointsStandard: pointsStd,
            guideNagoya: guideNgy,
            pointsNagoya: pointsNgy,
            speechStandard: data.speech_text_standard || `${itemLabel}は、${categoryLabel}です。${guideStd}`,
            speechNagoya: data.speech_text_nagoya || `${itemLabel}は、${categoryLabel}だがね。${guideNgy}`
          };

          document.getElementById("item-name").textContent = itemLabel;
          applyCategoryStyle(categoryLabel);
          updateDisplayedResult();
          document.getElementById("source-url").href =
            res.url || data.url || "https://www.city.nagoya.jp/kurashi/category/5-4-0-0-0-0-0-0-0-0.html";

          document.getElementById("result-area").style.display = "block";

          // 4パターンの音声をキャッシュに保存
          if (data.audios) {
            audioCache = { ...audioCache, ...data.audios };
          }
          if (data.audio_female && !audioCache.standard_female) {
            audioCache.standard_female = data.audio_female;
          }
          if (data.audio_male && !audioCache.standard_male) {
            audioCache.standard_male = data.audio_male;
          }
          const activeKey = `${selectedDialect}_${selectedGender}`;
          const fallbackB64 = data.audio_base64 || data.audioBase64 || "";
          if (fallbackB64 && !audioCache[activeKey]) {
            audioCache[activeKey] = fallbackB64;
          }

          speakResult();
        } else {
          alert("エラーが発生しました: " + (data.message || data.error || "不明なエラー"));
        }
      } catch (err) {
        document.getElementById("loading").style.display = "none";
        alert("通信エラーが発生しました。\n" + err);
      }
    }

    async function fetchPollyVoiceForCurrentText() {
      const textToSpeak = getActiveSpeechText();
      if (!textToSpeak) return;

      const speakBtn = document.querySelector(".speak-btn");
      const originalHTML = speakBtn.innerHTML;
      speakBtn.textContent = " 音声を切り替えています...";
      speakBtn.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: "tts_only",
            speech_text: textToSpeak,
            voice: selectedGender
          })
        });
        const data = await response.json();
        const audioB64 = data.audio_base64 || data.audioBase64 || "";
        if (audioB64) {
          audioCache[`${selectedDialect}_${selectedGender}`] = audioB64;
        }
      } catch (e) {
        console.warn("Polly音声の切替取得に失敗しました:", e);
      } finally {
        speakBtn.innerHTML = originalHTML;
        speakBtn.disabled = false;
        speakResult();
      }
    }

    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function normalizeForJapaneseSpeech(text) {
      return text
        .replace(/（/g, "、")
        .replace(/）/g, "、")
        .replace(/『|』/g, "")
        .replace(/分別区分/g, "ぶんべつくぶん")
        .replace(/資源/g, "しげん")
        .replace(/可燃/g, "かねん")
        .replace(/不燃/g, "ふねん")
        .replace(/容器包装/g, "ようきほうそう")
        .replace(/回収/g, "かいしゅう")
        .replace(/環境事業所/g, "かんきょうじぎょうしょ");
    }

    function fixBrokenJapanese(text) {
      return text
        .replace(/ますです/g, "ます")
        .replace(/ませんです/g, "ません")
        .replace(/でしたです/g, "でした")
        .replace(/くださいです/g, "ください")
        .replace(/。。+/g, "。")
        .trim();
    }

    function speakResult() {
      const textToSpeak = getActiveSpeechText();
      if (!textToSpeak) return;
      stopCurrentAudio();

      // 1. Amazon Polly の MP3 音声がある場合は最優先で再生
      const cacheKey = `${selectedDialect}_${selectedGender}`;
      const pollyBase64 = audioCache[cacheKey];
      if (pollyBase64) {
        currentAudio = new Audio("data:audio/mp3;base64," + pollyBase64);
        currentAudio.play().catch(err => {
          console.warn("Polly音声の自動再生がブロックされました:", err);
        });
        return;
      }

      // 2. フォールバック：ブラウザ標準の Web Speech API
      if (!("speechSynthesis" in window)) return;
      if (!femaleVoice && !maleVoice) {
        loadJapaneseVoices();
      }

      let cleanText = normalizeForJapaneseSpeech(textToSpeak);
      cleanText = fixBrokenJapanese(cleanText);

      const uttr = new SpeechSynthesisUtterance(cleanText);
      uttr.lang = "ja-JP";
      uttr.rate = 0.85;

      if (selectedGender === "male" && maleVoice) {
        uttr.voice = maleVoice;
        uttr.pitch = (maleVoice === femaleVoice) ? 0.9 : 1.0;
      } else if (femaleVoice) {
        uttr.voice = femaleVoice;
        uttr.pitch = 1.0;
      }

      window.speechSynthesis.speak(uttr);
    }
  </script>
